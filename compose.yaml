name: growhub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: growhub
      POSTGRES_USER: growhub
      POSTGRES_PASSWORD: growhub
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growhub -d growhub"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./docker/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DOTENV_<KEY> values are written into backend/.env as <KEY> on every start
      # (see docker/backend/entrypoint.sh). They are prefixed so they do not leak
      # into the process env, where they would override phpunit.xml and make
      # tests run against the dev database.
      DOTENV_APP_URL: http://localhost:${BACKEND_PORT:-8001}
      DOTENV_DB_CONNECTION: pgsql
      DOTENV_DB_HOST: db
      DOTENV_DB_PORT: 5432
      DOTENV_DB_DATABASE: growhub
      DOTENV_DB_USERNAME: growhub
      DOTENV_DB_PASSWORD: growhub
      DOTENV_MAIL_MAILER: smtp
      DOTENV_MAIL_HOST: mailpit
      DOTENV_MAIL_PORT: 1025
      DOTENV_MAIL_USERNAME: "null"
      DOTENV_MAIL_PASSWORD: "null"
      DOTENV_MAIL_SCHEME: "null"
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./backend:/var/www/html

  frontend:
    image: node:24-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8001
      VITE_USE_POLLING: "true"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
  frontend-node-modules:
