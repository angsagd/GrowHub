name: growhub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: growhub
      POSTGRES_USER: growhub
      POSTGRES_PASSWORD: growhub
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growhub -d growhub"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./docker/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Written into backend/.env on every start (see docker/backend/entrypoint.sh)
      DOCKER_ENV_KEYS: APP_URL DB_CONNECTION DB_HOST DB_PORT DB_DATABASE DB_USERNAME DB_PASSWORD MAIL_MAILER MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_SCHEME
      APP_URL: http://localhost:${BACKEND_PORT:-8001}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: growhub
      DB_USERNAME: growhub
      DB_PASSWORD: growhub
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: "null"
      MAIL_PASSWORD: "null"
      MAIL_SCHEME: "null"
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./backend:/var/www/html

  frontend:
    image: node:24-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8001
      VITE_USE_POLLING: "true"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
  frontend-node-modules:
